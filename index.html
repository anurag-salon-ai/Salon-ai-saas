<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon AI SaaS - Smart Billing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 font-sans">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <i class="fa-solid fa-scissors"></i> Salon AI POS
        </h1>
        <span class="text-xs bg-indigo-800 px-2.5 py-1 rounded-full">Pro v1.0</span>
    </header>

    <!-- Main App Container -->
    <main class="max-w-4xl mx-auto p-4 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Left Side: Billing Inputs -->
        <section class="md:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-slate-700">New Bill</h2>
                <button id="voiceBtn" onclick="startVoiceBilling()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-2 transition">
                    <i class="fa-solid fa-microphone"></i> Voice Bill
                </button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Customer Name / Mobile</label>
                    <input type="text" id="custName" placeholder="e.g. Rahul Sharma (9876543210)" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Select Service</label>
                        <select id="serviceSelect" class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="Haircut|150">Haircut - ₹150</option>
                            <option value="Shave|100">Shave - ₹100</option>
                            <option value="Facial|500">Facial - ₹500</option>
                            <option value="Hair Color|400">Hair Color - ₹400</option>
                            <option value="Head Massage|200">Head Massage - ₹200</option>
                        </select>
                    </div>
                    <div class="flex items-end">
                        <button onclick="addItem()" class="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-semibold text-sm hover:bg-indigo-700 transition">+ Add Item</button>
                    </div>
                </div>

                <!-- Items Table -->
                <div class="border rounded-lg overflow-hidden mt-4">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 text-slate-500">
                            <tr>
                                <th class="p-2.5">Service</th>
                                <th class="p-2.5 text-right">Price</th>
                                <th class="p-2.5 text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody id="itemList" class="divide-y divide-slate-100">
                            <!-- Dynamic Items -->
                        </tbody>
                    </table>
                </div>

                <!-- Discount Section -->
                <div class="grid grid-cols-2 gap-3 pt-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Discount Type</label>
                        <select id="discType" onchange="calculateTotal()" class="w-full p-2 border rounded-lg text-sm">
                            <option value="flat">Flat (₹)</option>
                            <option value="percent">Percentage (%)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Discount Value</label>
                        <input type="number" id="discVal" value="0" oninput="calculateTotal()" class="w-full p-2 border rounded-lg text-sm">
                    </div>
                </div>
            </div>
        </section>

        <!-- Right Side: Summary & Actions -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
            <div>
                <h2 class="text-lg font-bold text-slate-700 mb-4">Payment Summary</h2>
                <div class="space-y-2 text-sm">
                    <div class="flex justify-between text-slate-600">
                        <span>Subtotal:</span>
                        <span id="subTotal">₹0</span>
                    </div>
                    <div class="flex justify-between text-slate-600">
                        <span>Discount:</span>
                        <span id="discAmt">-₹0</span>
                    </div>
                    <hr class="my-2">
                    <div class="flex justify-between text-base font-bold text-slate-800">
                        <span>Total Payable:</span>
                        <span id="grandTotal" class="text-indigo-600">₹0</span>
                    </div>
                </div>
            </div>

            <div class="space-y-2 mt-6">
                <button onclick="printBill()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold text-sm shadow flex items-center justify-center gap-2 transition">
                    <i class="fa-solid fa-print"></i> Print Receipt
                </button>
                <button onclick="sendWhatsApp()" class="w-full bg-green-500 hover:bg-green-600 text-white py-2.5 rounded-xl font-semibold text-sm flex items-center justify-center gap-2 transition">
                    <i class="fa-brands fa-whatsapp"></i> Send WhatsApp Bill
                </button>
            </div>
        </section>
    </main>

    <script>
        let items = [];

        function addItem() {
            const sel = document.getElementById('serviceSelect').value.split('|');
            items.push({ name: sel[0], price: parseFloat(sel[1]) });
            renderItems();
        }

        function removeItem(idx) {
            items.splice(idx, 1);
            renderItems();
        }

        function renderItems() {
            const tbody = document.getElementById('itemList');
            tbody.innerHTML = '';
            items.forEach((item, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td class="p-2.5 font-medium">${item.name}</td>
                        <td class="p-2.5 text-right">₹${item.price}</td>
                        <td class="p-2.5 text-center">
                            <button onclick="removeItem(${index})" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
            calculateTotal();
        }

        function calculateTotal() {
            let sub = items.reduce((acc, curr) => acc + curr.price, 0);
            let type = document.getElementById('discType').value;
            let val = parseFloat(document.getElementById('discVal').value) || 0;
            let disc = type === 'flat' ? val : (sub * val) / 100;
            let grand = Math.max(0, sub - disc);

            document.getElementById('subTotal').innerText = '₹' + sub;
            document.getElementById('discAmt').innerText = '-₹' + disc.toFixed(2);
            document.getElementById('grandTotal').innerText = '₹' + grand.toFixed(2);
        }

        function startVoiceBilling() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('Voice recognition browser supports nahi karta.');
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';
            recognition.start();

            document.getElementById('voiceBtn').innerText = 'Sun raha hu...';

            recognition.onresult = (e) => {
                let text = e.results[0][0].transcript.toLowerCase();
                document.getElementById('voiceBtn').innerHTML = '<i class="fa-solid fa-microphone"></i> Voice Bill';
                if (text.includes('haircut') || text.includes('बाल')) {
                    items.push({ name: 'Haircut', price: 150 });
                } else if (text.includes('shave') || text.includes('दाढ़ी')) {
                    items.push({ name: 'Shave', price: 100 });
                } else if (text.includes('facial') || text.includes('फेशियल')) {
                    items.push({ name: 'Facial', price: 500 });
                }
                renderItems();
            };

            recognition.onerror = () => {
                document.getElementById('voiceBtn').innerHTML = '<i class="fa-solid fa-microphone"></i> Voice Bill';
            };
        }

        function printBill() {
            window.print();
        }

        function sendWhatsApp() {
            let name = document.getElementById('custName').value || 'Customer';
            let total = document.getElementById('grandTotal').innerText;
            let msg = `Namaste ${name}! Salon aane ke liye dhanyawad. Aapka kul bill ${total} hai. Phir zaroor aayein!`;
            window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
        }
    </script>
</body>
                      </html>
